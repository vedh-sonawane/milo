<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milo</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --accent: #2f6fd6; --accent-text: #ffffff; --ok: #1f9d55; --warn: #c27c0e; --bad: #d64545;
    --chip: #eef2fb; --chip-text: #2b4f91;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ecece8; --muted: #9a9a93; --line: #33332f;
      --accent: #5b93ec; --accent-text: #0e1420; --ok: #3cc47a; --warn: #e0a23a; --bad: #ef6b6b;
      --chip: #22304a; --chip-text: #b9cdf2;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0 8px 0 0; letter-spacing: .02em; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
          background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
           padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .6; cursor: default; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } #side { order: -1; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; gap: 8px; }
  input[type=text], select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                             border-radius: 8px; padding: 8px 10px; }
  input[type=text] { flex: 1; min-width: 0; }
  #answer { margin-top: 14px; font-size: 16px; white-space: pre-wrap; }
  #answer.muted, .muted { color: var(--muted); }
  .sources { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; }
  .memory { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
  .memory:last-child { border-bottom: 0; }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; font-size: 14px; }
  .body { flex: 1; min-width: 0; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--chip); color: var(--chip-text); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
  .chip.date { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
  .del { border: 0; background: none; color: var(--muted); padding: 2px 6px; align-self: start; }
  .del:hover { color: var(--bad); }
  #frame { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: var(--bg); display: block; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .timeline-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .timeline-head h2 { margin: 0; }
  .things { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .thing { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .thing .name { font-weight: 600; }
  .thing .count { color: var(--muted); font-size: 13px; float: right; }
  .thing .where { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .unsure { color: var(--warn); font-size: 12px; }
  .deadline { display: flex; align-items: baseline; gap: 12px; padding: 6px 0; }
  .deadline .when { min-width: 92px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .deadline .left { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .deadline.soon .when, .deadline.soon .left { color: var(--warn); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Milo</h1>
    <span class="pill"><span id="dot" class="dot"></span><span id="state">Connecting</span></span>
    <span id="pending" class="muted"></span>
    <span class="spacer"></span>
    <button id="toggle" class="primary" disabled>...</button>
  </div>
</header>

<main>
  <div>
    <section class="card" id="deadlinesCard" style="display:none; margin-bottom:16px">
      <h2>Coming up</h2>
      <div id="deadlines"></div>
    </section>

    <section class="card">
      <h2>Ask Milo</h2>
      <form id="ask" class="row">
        <input id="question" type="text" placeholder="Where did I last see my calculator?" autocomplete="off">
        <button class="primary" type="submit">Ask</button>
      </form>
      <div id="answer" class="muted">Ask about anything Milo has seen.</div>
      <div id="sources"></div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Things Milo knows</h2>
      <div id="things" class="muted">Loading...</div>
    </section>

    <section class="card" style="margin-top:16px">
      <div class="timeline-head">
        <h2>Memories</h2>
        <select id="hours" aria-label="Time range">
          <option value="3">Last 3 hours</option>
          <option value="24" selected>Last 24 hours</option>
          <option value="72">Last 3 days</option>
          <option value="168">Last 7 days</option>
        </select>
      </div>
      <div id="timeline" class="muted">Loading...</div>
    </section>
  </div>

  <aside id="side" class="card">
    <h2>What Milo sees</h2>
    <img id="frame" alt="Latest camera frame">
    <dl>
      <dt>Last photo checked</dt><dd id="lastCapture">-</dd>
      <dt>Frames checked</dt><dd id="frames">0</dd>
      <dt>Skipped (unusable: covered, dark)</dt><dd id="blurry">0</dd>
      <dt>Recorded instantly</dt><dd id="queued">0</dd>
      <dt>Described by the AI</dt><dd id="saved">0</dd>
      <dt>Too many to describe (kept)</dt><dd id="dropped">0</dd>
    </dl>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
let running = false, lastMemoryId = null, busy = false;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function fmtTime(iso) {
  const d = new Date(iso), today = new Date();
  const t = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  return d.toDateString() === today.toDateString() ? t : d.toLocaleDateString([], {weekday: "short"}) + " " + t;
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}

async function refreshStatus() {
  let s;
  try { s = await api("/api/status"); }
  catch { $("dot").className = "dot bad"; $("state").textContent = "Milo server not running"; return; }
  running = s.running;
  const dot = $("dot"), state = $("state");
  if (!s.running) { dot.className = "dot"; state.textContent = "Paused"; }
  else if (s.camera_online === false) { dot.className = "dot bad"; state.textContent = "Camera offline"; }
  else if (s.camera_online) { dot.className = "dot ok"; state.textContent = "Watching"; }
  else { dot.className = "dot warn"; state.textContent = "Connecting to camera"; }
  state.title = s.last_error || "";
  $("pending").textContent = s.pending ? `${s.pending} scene${s.pending > 1 ? "s" : ""} waiting to be remembered` : "";
  const btn = $("toggle");
  btn.disabled = busy; btn.textContent = s.running ? "Pause" : "Start watching";
  btn.className = s.running ? "" : "primary";
  $("lastCapture").textContent = s.last_capture_at ? fmtTime(s.last_capture_at) : "-";
  for (const k of ["frames", "blurry", "queued", "saved", "dropped"]) $(k).textContent = s.counts[k];
  showFrame(s);
  const newId = s.last_memory && s.last_memory.id;
  if (newId && newId !== lastMemoryId) { lastMemoryId = newId; refreshTimeline(); refreshThings(); refreshDeadlines(); }
}

// Smooth live video when the camera allows it (USB webcam); otherwise Milo's latest snapshot (ESP32).
let liveOn = false;
function showFrame(s) {
  const img = $("frame");
  const wantLive = s.running && s.camera_online && s.live;
  if (wantLive && !liveOn) { img.src = "/api/live"; liveOn = true; }
  else if (!wantLive && liveOn) { img.removeAttribute("src"); liveOn = false; }
  if (!wantLive && s.running && s.camera_online) img.src = "/api/latest.jpg?t=" + Date.now();
}
$("frame").addEventListener("error", () => { liveOn = false; });  // stream dropped: reconnect on next status

function memoryHtml(m, withDelete) {
  const chips = [
    ...m.text_seen.map(t => `<span class="chip">"${esc(t)}"</span>`),
    ...m.dates.filter(d => d && d.date).map(d => `<span class="chip date">${esc(d.date)}${d.about ? " - " + esc(d.about) : ""}</span>`),
  ].join("");
  const objects = m.objects.map(o => o && o.name).filter(Boolean).join(", ");
  const meta = [m.location, m.activity, objects && "sees: " + objects].filter(Boolean).map(esc).join(" &middot; ");
  return `<div class="memory">
    <div class="time">${fmtTime(m.timestamp)}</div>
    <div class="body"><div>${m.summary ? esc(m.summary) : '<span class="muted">Recorded instantly; Milo is still looking at this scene...</span>'}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
      ${chips ? `<div class="chips">${chips}</div>` : ""}</div>
    ${withDelete ? `<button class="del" title="Delete this memory" data-id="${m.id}">Delete</button>` : ""}
  </div>`;
}

async function refreshDeadlines() {
  try {
    const list = await api("/api/deadlines");
    $("deadlinesCard").style.display = list.length ? "" : "none";
    $("deadlines").innerHTML = list.map((d, i) => {  // the soonest one is highlighted
      const due = new Date(d.due + "T00:00:00");
      const left = d.days_left === 0 ? "today" : d.days_left === 1 ? "tomorrow" : `in ${d.days_left} days`;
      return `<div class="deadline${i === 0 ? " soon" : ""}">
        <span class="when">${due.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"})}</span>
        <span>${esc(d.title)}</span><span class="left">${left}</span></div>`;
    }).join("");
  } catch { /* keep whatever was shown */ }
}

async function refreshThings() {
  const el = $("things");
  try {
    const list = await api("/api/things?hours=" + $("hours").value);
    el.className = list.length ? "things" : "muted";
    el.innerHTML = list.length ? list.map(t => {
      const s = t.sightings[0];
      const unsure = t.times_seen === 1 ? "seen once, may be wrong"
                   : (s.match < 0.92 ? `last seen as "${esc(s.seen_as)}", not certain` : "");
      return `<div class="thing"><span class="count">${t.times_seen}x</span>
        <div class="name">${esc(t.name)}</div>
        <div class="where">Last: ${fmtTime(s.timestamp)}, ${esc(s.place)}${s.position ? " - " + esc(s.position) : ""}</div>
        ${unsure ? `<div class="unsure">${unsure}</div>` : ""}</div>`;
    }).join("") : "No things yet. Milo learns objects as it remembers scenes.";
  } catch (e) { el.className = "muted"; el.textContent = "Could not load things: " + e.message; }
}

async function refreshTimeline() {
  const el = $("timeline");
  try {
    const list = await api("/api/memories?hours=" + $("hours").value);
    el.className = list.length ? "" : "muted";
    el.innerHTML = list.length ? list.map(m => memoryHtml(m, true)).join("") : "No memories in this time range yet.";
  } catch (e) { el.className = "muted"; el.textContent = "Could not load memories: " + e.message; }
}

$("timeline").addEventListener("click", async e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id || !confirm("Delete this memory for good?")) return;
  await api("/api/memories/" + id, {method: "DELETE"});
  refreshThings();
  refreshTimeline();
});

$("hours").addEventListener("change", () => { refreshTimeline(); refreshThings(); });

$("toggle").addEventListener("click", async () => {
  busy = true; $("toggle").disabled = true; $("toggle").textContent = running ? "Pausing..." : "Starting...";
  try { await api(running ? "/api/watch/stop" : "/api/watch/start", {method: "POST"}); }
  finally { busy = false; refreshStatus(); }
});

$("ask").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("question").value.trim();
  if (!q) return;
  const ans = $("answer"), src = $("sources");
  ans.className = "muted"; ans.textContent = "Thinking..."; src.innerHTML = "";
  try {
    // Streamed: words appear as Milo writes them (one JSON object per line), then the final answer + sources.
    const resp = await fetch("/api/ask/stream", {method: "POST", headers: {"Content-Type": "application/json"},
                                                 body: JSON.stringify({question: q, hours: Number($("hours").value)})});
    if (!resp.ok) throw new Error((await resp.text()) || resp.statusText);
    const reader = resp.body.getReader(), decoder = new TextDecoder();
    let buffered = "", started = false;
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffered += decoder.decode(value, {stream: true});
      const lines = buffered.split("\n");
      buffered = lines.pop();
      for (const line of lines.filter(Boolean)) {
        const ev = JSON.parse(line);
        if (!started) { ans.className = ""; ans.textContent = ""; started = true; }
        if (ev.text) ans.textContent += ev.text;
        if (ev.done) {
          ans.textContent = ev.answer;
          if (ev.sources.length)
            src.innerHTML = `<div class="sources"><div class="muted">Based on</div>${ev.sources.map(m => memoryHtml(m, false)).join("")}</div>`;
        }
      }
    }
  } catch (err) { ans.className = "muted"; ans.textContent = "Milo could not answer: " + err.message; }
});

refreshStatus(); refreshTimeline(); refreshThings(); refreshDeadlines();
setInterval(refreshStatus, 2000);
setInterval(() => { refreshTimeline(); refreshThings(); refreshDeadlines(); }, 30000);
</script>
</body>
</html>
